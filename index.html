<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 50px auto; }
    input { padding: 8px; width: 70%; }
    button { padding: 8px 12px; margin-left: 5px; cursor: pointer; }
    li { margin: 8px 0; }
    li.done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>📝 Ma To-Do List</h1>
  <input id="taskInput" type="text" placeholder="Nouvelle tâche...">
  <button onclick="addTask()">Ajouter</button>
  <ul id="taskList"></ul>

  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.innerHTML = `
        <input type="checkbox" onclick="toggleDone(this)">
        ${text}
        <button onclick="deleteTask(this)">🗑️ Supprimer</button>
      `;
      document.getElementById('taskList').appendChild(li);
      input.value = '';
    }

    function deleteTask(btn) {
      btn.parentElement.remove();
    }

    function toggleDone(checkbox) {
      checkbox.parentElement.classList.toggle('done');
    }
  </script>
</body>
</html>
